<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IoT Dashboard - REST API</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; padding: 20px; color: #333; }
  .container { max-width: 1000px; margin: 0 auto; }
  h1 { color: white; text-align: center; margin-bottom: 25px; font-size: 28px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
  .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; transition: transform 0.2s; }
  .card:hover { transform: translateY(-5px); }
  .card .label { font-size: 14px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .card .value { font-size: 42px; font-weight: bold; margin: 10px 0; color: #667eea; }
  .card .unit { font-size: 18px; color: #aaa; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; }
  .status-online { background: #d4edda; color: #155724; }
  .status-offline { background: #f8d7da; color: #721c24; }
  .panel { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 25px; }
  .panel h2 { font-size: 18px; margin-bottom: 15px; color: #444; }
  .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
  .btn { padding: 12px 30px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .btn-on { background: #28a745; color: white; }
  .btn-on:hover { background: #218838; }
  .btn-off { background: #dc3545; color: white; }
  .btn-off:hover { background: #c82333; }
  .btn-set { background: #667eea; color: white; }
  .btn-set:hover { background: #5568d3; }
  input[type=number] { padding: 11px; border: 1px solid #ccc; border-radius: 10px; font-size: 15px; width: 120px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
  th { background: #f8f9fa; color: #666; text-transform: uppercase; font-size: 12px; }
  tr:hover td { background: #f9f9f9; }
  #log { background: #1e1e1e; color: #0f0; font-family: monospace; padding: 15px; border-radius: 10px; max-height: 180px; overflow-y: auto; font-size: 13px; line-height: 1.6; }
  #log .error { color: #f66; }
  #log .info { color: #6af; }
  #log .warn { color: #fc6; }
  #alertBox { display: none; background: #dc3545; color: white; padding: 16px 20px; border-radius: 12px; margin-bottom: 20px; font-weight: 600; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
</style>
</head>
<body>
<div class="container">
  <h1>🌡️ IoT Dashboard — REST API</h1>

  <div id="alertBox"></div>

  <!-- Kartu Sensor -->
  <div class="cards">
    <div class="card">
      <div class="label">Suhu</div>
      <div class="value" id="suhu">--</div>
      <div class="unit">°C</div>
    </div>
    <div class="card">
      <div class="label">Kelembaban</div>
      <div class="value" id="kelembaban">--</div>
      <div class="unit">%</div>
    </div>
    <div class="card">
      <div class="label">Status Sensor</div>
      <div class="value" style="font-size:22px;">
        <span class="status-badge status-offline" id="status-badge">OFFLINE</span>
      </div>
      <div class="unit" id="ws-state" style="font-size:13px;">WebSocket: terputus</div>
    </div>
  </div>

  <!-- Kontrol -->
  <div class="panel">
    <h2>💡 Kontrol Perangkat</h2>
    <div class="controls">
      <button class="btn btn-on" onclick="kontrol('lamp','on')">Nyalakan Lampu</button>
      <button class="btn btn-off" onclick="kontrol('lamp','off')">Matikan Lampu</button>
    </div>
  </div>

  <!-- Threshold -->
  <div class="panel">
    <h2>🚨 Batas Suhu (Threshold)</h2>
    <div class="controls">
      <input type="number" id="thr" value="30" step="0.5">
      <span>°C</span>
      <button class="btn btn-set" onclick="setThreshold()">Simpan Batas</button>
    </div>
  </div>

  <!-- Grafik -->
  <div class="panel">
    <h2>📈 Grafik Real-time</h2>
    <canvas id="chart" height="100"></canvas>
  </div>

  <!-- History -->
  <div class="panel">
    <h2>🗂️ 10 Data Sensor Terakhir</h2>
    <table>
      <thead><tr><th>Waktu</th><th>Suhu (°C)</th><th>Kelembaban (%)</th></tr></thead>
      <tbody id="history-body">
        <tr><td colspan="3" style="text-align:center;color:#999;">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Log -->
  <div class="panel">
    <h2>📋 Log Aktivitas</h2>
    <div id="log"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
// ==============================
// KONFIGURASI
// ==============================
const API_KEY = 'rahasia123';   // harus sama dengan API key di Node-RED
// Jika dibuka lewat http://localhost:1880/dashboard, ORIGIN kosong (satu alamat dengan API).
// Jika dibuka langsung dari file (file://), arahkan ke Node-RED di localhost:1880.
const ORIGIN = location.protocol.startsWith('http') ? '' : 'http://localhost:1880';
const API_BASE = ORIGIN + '/api';
const WS_HOST = ORIGIN ? 'localhost:1880' : location.host;
const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + WS_HOST + '/ws/sensor';

let rows = [];          // data sensor terbaru (maks 50)
let lastSeen = 0;       // waktu data terakhir diterima

// ==============================
// UTILITY
// ==============================
function log(msg, type = 'info') {
  const el = document.getElementById('log');
  const div = document.createElement('div');
  div.className = type;
  div.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function api(path, options = {}) {
  return fetch(API_BASE + path, {
    ...options,
    headers: { 'X-API-Key': API_KEY, 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
}

function setBadge(online) {
  const b = document.getElementById('status-badge');
  b.textContent = online ? 'ONLINE' : 'OFFLINE';
  b.className = 'status-badge ' + (online ? 'status-online' : 'status-offline');
}

// ==============================
// GRAFIK (Chart.js)
// ==============================
const chart = (typeof Chart !== 'undefined') ? new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'Suhu (°C)', data: [], borderColor: '#e74c3c', backgroundColor: '#e74c3c33', tension: 0.3 },
      { label: 'Kelembaban (%)', data: [], borderColor: '#3498db', backgroundColor: '#3498db33', tension: 0.3 }
    ]
  },
  options: { animation: false, responsive: true }
}) : null;

if (!chart) log('Chart.js gagal dimuat (cek koneksi internet)', 'warn');

function addPoint(d) {
  if (!chart) return;
  chart.data.labels.push(new Date(d.received).toLocaleTimeString());
  chart.data.datasets[0].data.push(d.suhu);
  chart.data.datasets[1].data.push(d.kelembaban);
  if (chart.data.labels.length > 30) {
    chart.data.labels.shift();
    chart.data.datasets.forEach(ds => ds.data.shift());
  }
  chart.update();
}

// ==============================
// TAMPILAN DATA
// ==============================
function updateCards(d) {
  document.getElementById('suhu').textContent = Number(d.suhu).toFixed(1);
  document.getElementById('kelembaban').textContent = Number(d.kelembaban).toFixed(1);
  setBadge(true);
  lastSeen = Date.now();
}

function renderHistory() {
  const tbody = document.getElementById('history-body');
  tbody.innerHTML = '';
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#999;">Belum ada data</td></tr>';
    return;
  }
  rows.slice(-10).reverse().forEach(d => {
    const tr = document.createElement('tr');
    [new Date(d.received).toLocaleTimeString(), d.suhu, d.kelembaban].forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
}

function handleSensor(d) {
  updateCards(d);
  rows.push(d);
  if (rows.length > 50) rows.shift();
  renderHistory();
  addPoint(d);
}

function showAlert(message) {
  const b = document.getElementById('alertBox');
  b.textContent = '⚠️ ' + message;
  b.style.display = 'block';
  log(message, 'error');
  clearTimeout(showAlert.t);
  showAlert.t = setTimeout(() => { b.style.display = 'none'; }, 6000);
}

// ==============================
// DATA AWAL (REST, sekali saat halaman dibuka)
// ==============================
async function loadInitial() {
  try {
    const hRes = await api('/history');
    if (hRes.status === 401) { log('API key salah (401)', 'error'); return; }
    const h = await hRes.json();
    rows = h.data || [];
    rows.forEach(addPoint);
    renderHistory();

    const sRes = await api('/suhu');
    const s = await sRes.json();
    if (s.status === 'success' && s.data && s.data.suhu !== null) updateCards(s.data);
    log('Data awal dimuat (' + rows.length + ' baris history)');
  } catch (err) {
    log('Gagal memuat data awal: ' + err.message, 'error');
  }
}

// ==============================
// WEBSOCKET (tanpa polling)
// ==============================
function connectWS() {
  const ws = new WebSocket(WS_URL);
  const state = document.getElementById('ws-state');
  ws.onopen = () => { state.textContent = 'WebSocket: terhubung'; log('WebSocket terhubung'); };
  ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === 'sensor') handleSensor(m.data);
      else if (m.type === 'alert') showAlert(m.message);
    } catch (err) { log('Pesan WS tidak valid: ' + err.message, 'error'); }
  };
  ws.onclose = () => {
    state.textContent = 'WebSocket: terputus, mencoba lagi...';
    setTimeout(connectWS, 3000);
  };
  ws.onerror = () => ws.close();
}

// Tandai OFFLINE jika tidak ada data baru > 10 detik (hanya pengecekan lokal, bukan polling server)
setInterval(() => { if (lastSeen && Date.now() - lastSeen > 10000) setBadge(false); }, 3000);

// ==============================
// KONTROL LAMPU (POST)
// ==============================
async function kontrol(device, action) {
  try {
    const res = await api('/kontrol', { method: 'POST', body: JSON.stringify({ device, action }) });
    const json = await res.json();
    if (json.status === 'success') log('✓ Perintah terkirim: ' + device + ' → ' + action);
    else log('✗ Gagal: ' + json.message, 'error');
  } catch (err) { log('✗ Error kontrol: ' + err.message, 'error'); }
}

// ==============================
// THRESHOLD (PUT)
// ==============================
async function setThreshold() {
  const v = Number(document.getElementById('thr').value);
  try {
    const res = await api('/threshold', { method: 'PUT', body: JSON.stringify({ max_suhu: v }) });
    const json = await res.json();
    if (json.status === 'success') log('✓ Batas suhu diset ke ' + json.max_suhu + ' °C');
    else log('✗ Gagal set batas: ' + json.message, 'error');
  } catch (err) { log('✗ Error threshold: ' + err.message, 'error'); }
}

// ==============================
// MULAI
// ==============================
log('Dashboard dimulai (WebSocket, tanpa polling)');
loadInitial();
connectWS();
</script>
</body>
</html>
